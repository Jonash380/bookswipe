name: CI/CD — Test & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE_NAME: bookswipe
  CONTAINER_NAME: bookswipe

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

  deploy:
    needs: test
    runs-on: self-hosted
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest .

      - name: Stop existing container
        run: docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true

      - name: Remove existing container
        run: docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true

      - name: Create .env from secrets if available
        run: |
          if [ -n "$BOOKSWIPE_ENV" ]; then
            echo "$BOOKSWIPE_ENV" > .env
          fi
        env:
          BOOKSWIPE_ENV: ${{ secrets.BOOKSWIPE_ENV }}

      - name: Start new container
        run: |
          ENV_FLAG=""
          if [ -f .env ]; then
            ENV_FLAG="--env-file .env"
          fi
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --restart unless-stopped \
            $ENV_FLAG \
            -p 3000:3000 \
            ${{ env.IMAGE_NAME }}:latest

      - name: Verify deployment
        run: |
          sleep 5
          curl -sf http://localhost:3000/health || (echo "Health check failed" && docker logs ${{ env.CONTAINER_NAME }} && exit 1)
          echo "✅ Deployment successful"
